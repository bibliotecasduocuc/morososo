<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de gesti&#243;n de morosos &#8212; Bibliotecas Duoc UC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{
    --negro:#1A1A1A;
    --amarillo:#FFB800;
    --amarillo-suave:#FFF1CC;
    --gris:#666666;
    --gris-claro:#EEEEEE;
    --gris-barra:#CCCCCC;
    --blanco:#FFFFFF;
    --borde:#DDDDDD;
    --error:#B3261E;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:12px;}
  body{margin:0;background:var(--gris-claro);color:var(--negro);font-family:'Lato',Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Merriweather',Georgia,serif;font-weight:700;margin:0;}
  button,select,input{font-family:'Lato',Arial,sans-serif;}
  :focus-visible{outline:3px solid var(--amarillo);outline-offset:2px;}

  /* ---------- ENCABEZADO ---------- */
  .hdr{background:var(--negro);color:var(--blanco);border-bottom:6px solid var(--amarillo);}
  .hdr-inner{max-width:1500px;margin:0 auto;padding:22px 24px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amarillo);font-weight:700;margin-bottom:6px;}
  .hdr h1{font-size:26px;line-height:1.2;color:var(--blanco);}
  .status{margin-top:10px;font-size:13.5px;color:#D6D6D6;display:flex;align-items:center;gap:8px;min-height:20px;}
  .status.ok .status-main{color:var(--amarillo);font-weight:700;}
  .status.warn .status-main{color:#FFD97A;font-weight:700;}
  .status-detail{color:#B5B5B5;font-size:12.5px;}
  .spinner{width:14px;height:14px;border:2px solid #666;border-top-color:var(--amarillo);border-radius:50%;animation:spin .8s linear infinite;flex:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hdr-controls{display:flex;gap:14px;flex-wrap:wrap;}
  .ctl{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#BDBDBD;}
  .ctl select,.ctl input{background:var(--blanco);color:var(--negro);border:none;border-radius:6px;padding:9px 12px;font-size:14px;font-weight:700;min-width:220px;}

  /* ---------- PESTA&#209;AS ---------- */
  .tabs{background:var(--blanco);border-bottom:1px solid var(--borde);}
  .tabs-inner{max-width:1500px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto;}
  .tab{background:none;border:none;border-bottom:3px solid transparent;padding:14px 16px 11px;font-size:14px;font-weight:700;color:var(--gris);cursor:pointer;white-space:nowrap;}
  .tab:hover{color:var(--negro);}
  .tab[aria-selected="true"]{color:var(--negro);border-bottom-color:var(--amarillo);}

  /* ---------- CONTENIDO ---------- */
  .wrap{max-width:1500px;margin:0 auto;padding:20px 24px 60px;}
  .filterbar{background:var(--blanco);border:1px solid var(--borde);border-radius:8px;padding:12px 16px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;}
  .filterbar .f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;}
  .filterbar select{border:1px solid var(--borde);border-radius:6px;padding:8px 10px;font-size:13.5px;background:var(--blanco);color:var(--negro);min-width:190px;}
  .filterbar .hint{margin-left:auto;font-size:12.5px;color:var(--gris);align-self:center;}
  .btn-sec{background:var(--blanco);border:1px solid #999;border-radius:6px;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--negro);cursor:pointer;}
  .btn-sec:hover{background:var(--amarillo);border-color:var(--amarillo);}
  .btn-sec[hidden]{display:none;}

  .sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:4px 0 16px;}
  .sec-head h2{font-size:28px;line-height:1.2;}
  .sec-sub{color:var(--gris);font-size:14px;}
  .section-dl{margin-left:auto;font-size:13px;color:var(--gris);display:flex;gap:6px;align-items:center;}

  .mini-btn{font-size:11px;font-weight:700;padding:4px 9px;border:1px solid #999;background:var(--blanco);color:var(--negro);border-radius:4px;cursor:pointer;}
  .mini-btn:hover{background:var(--amarillo);border-color:var(--amarillo);}
  .mini-btn:disabled{opacity:.6;cursor:wait;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px;}
  .kpi{background:var(--blanco);border:1px solid var(--borde);border-top:3px solid var(--negro);border-radius:4px;padding:14px 16px;}
  .kpi-n{font-size:30px;font-weight:700;line-height:1.1;}
  .kpi-l{font-size:12px;color:var(--gris);margin-top:4px;}

  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px;}
  .panel{background:var(--blanco);border:1px solid var(--borde);border-radius:8px;padding:18px;min-width:0;}
  .panel.full{grid-column:1 / -1;}
  .panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px;}
  .panel h3{font-size:16px;line-height:1.3;}
  .note{margin:4px 0 0;font-size:12.5px;color:var(--gris);}
  .panel-actions{display:flex;gap:6px;flex:none;}
  .chart-box{position:relative;width:100%;}

  .tbl-wrap{overflow-x:auto;}
  .tbl-wrap.scroll{max-height:620px;overflow:auto;}
  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tbl th{background:var(--gris-claro);color:var(--gris);font-size:11.5px;font-weight:700;text-align:left;padding:8px 10px;white-space:nowrap;position:sticky;top:0;}
  .tbl th.sortable{cursor:pointer;user-select:none;}
  .tbl th.sortable:hover,.tbl th.sorted{color:var(--negro);}
  .tbl td{padding:8px 10px;border-bottom:1px solid var(--gris-claro);vertical-align:middle;}
  .tbl .num{text-align:right;font-variant-numeric:tabular-nums;}
  .tbl tr.clickable{cursor:pointer;}
  .tbl tr.clickable:hover td{background:#FAFAFA;}
  .tbl tr.sel td{background:var(--amarillo-suave);}
  .tbl tr.total td{font-weight:700;border-top:2px solid var(--negro);background:var(--blanco);}
  .tbl .zero{color:#BBB;}
  .mini{display:flex;height:12px;background:var(--gris-claro);border-radius:3px;overflow:hidden;min-width:120px;}
  .mini span{display:block;height:100%;}
  .mini .k{background:var(--negro);}
  .mini .y{background:var(--amarillo);}

  .prog-row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 110px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px;}
  .prog-bar{background:var(--gris-claro);border-radius:4px;height:14px;overflow:hidden;}
  .prog-fill{background:var(--negro);height:100%;border-radius:4px;}
  .prog-val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
  .prog-val small{color:var(--gris);font-weight:400;}

  .notice{background:var(--blanco);border:1px solid var(--borde);border-left:4px solid var(--amarillo);border-radius:6px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;}
  .notice.err{border-left-color:var(--error);}
  .notice b{font-weight:700;}
  .legend-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:baseline;}

  #toast{position:fixed;right:18px;bottom:18px;background:var(--negro);color:var(--blanco);border-left:4px solid var(--amarillo);padding:12px 16px;border-radius:6px;font-size:13px;max-width:380px;display:none;z-index:50;}

  .exporting .panel-actions,.exporting .section-dl{visibility:hidden;}

  @media (max-width:860px){
    .grid2{grid-template-columns:1fr;}
    .hdr-controls{width:100%;}
    .ctl{flex:1 1 100%;}
    .ctl select,.ctl input{width:100%;min-width:0;}
    .section-dl{margin-left:0;width:100%;}
    .filterbar .hint{margin-left:0;}
    .prog-row{grid-template-columns:1fr 90px;}
    .prog-row .prog-bar{grid-column:1 / -1;order:3;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important;scroll-behavior:auto !important;}
  }
  @media print{
    @page{size:A4 landscape;margin:10mm;}
    body{background:#fff;}
    .hdr-controls,.tabs,.filterbar,.panel-actions,.section-dl,#toast{display:none !important;}
    .hdr{border-bottom-width:4px;}
    .hdr-inner{padding:10px 0;}
    .wrap{padding:10px 0;max-width:none;}
    .panel,.kpi,.notice{break-inside:avoid;page-break-inside:avoid;}
    .tbl-wrap.scroll{max-height:none;overflow:visible;}
    .tbl th{position:static;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div>
      <div class="eyebrow">Bibliotecas Duoc UC</div>
      <h1>Panel de gesti&#243;n de morosos</h1>
      <div class="status" id="status" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span class="status-main">Cargando los datos, espera un momento&#8230;</span></div>

    <div class="hdr-controls">

  </div>
</header>

<nav class="tabs" aria-label="Secciones del panel">

</nav>

<main class="wrap">

    <button class="btn-sec" id="clearBtn" type="button">Limpiar filtros</button>
    <button class="btn-sec" id="reportDateBtn" type="button" hidden>Usar fecha del informe</button>
    <div class="hint" id="hint"></div>
  </div>
  <div id="view" role="tabpanel"></div>
</main>
<div id="toast" role="alert"></div>

function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], field = '', inQ = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if(c === '"') inQ = true;
    else if(c === ','){ row.push(field); field = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = '';
      if(row.some(v => v !== '')) rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if(row.some(v => v !== '')) rows.push(row);
  return rows;
}
const normKey = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const COLUMN_ALIASES = {
  callNumber: ['callnumber','identificador','signatura'],
  libraryDescription: ['librarydescription','sede','biblioteca'],
  dateCharged: ['datecharged','fechaprestamo','fechadeprestamo'],
  dateDue: ['datedue','fechadevencimiento','fechadevolucion','fechadedevolucion'],
  title2: ['title2','titulo'],
  location: ['location','estado','ubicacion'],
  dateCreated: ['datecreated','fechacreacion','fechadecarga','fechadelinforme']
};
function rowsFromCSV(text){
  const table = parseCSV(text);
  if(table.length < 2) throw new Error('La planilla no tiene filas de datos.');
  const header = table[0].map(normKey);
  const idx = {};
  Object.keys(COLUMN_ALIASES).forEach(k => {
    const pos = header.findIndex(h => COLUMN_ALIASES[k].includes(h));
    if(pos >= 0) idx[k] = pos;
  });
  const required = ['callNumber','libraryDescription','dateCharged','dateDue'];
  const missing = required.filter(k => !(k in idx));
  if(missing.length) throw new Error('faltan columnas: ' + missing.join(', ') + ' (encabezados encontrados: ' + table[0].join(', ') + ')');
  const out = [];
  for(let i=1;i<table.length;i++){
    const r = table[i], o = {};
    Object.keys(idx).forEach(k => { o[k] = (r[idx[k]] || '').trim() || null; });
    if(!o.callNumber && !o.dateDue) continue;
    out.push(o);
  }
  return out;
}

function parseDate(val){
  if(val instanceof Date && !isNaN(val)) return val;
  if(typeof val !== 'string') return null;
  const s = val.trim();
  if(!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    const a = +m[1], b = +m[2];
    const day = dateOrder === 'dmy' ? a : b;
    const mon = dateOrder === 'dmy' ? b : a;
    if(mon < 1 || mon > 12 || day < 1 || day > 31) return null;
    return new Date(+m[3], mon-1, day, +(m[4]||0), +(m[5]||0), +(m[6]||0));
  }
  return null;
}
function detectDateOrder(samples){
  let first = false, second = false;
  samples.forEach(s => {
    const m = typeof s === 'string' && s.trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-]\d{4}/);
    if(m){ if(+m[1] > 12) first = true; if(+m[2] > 12) second = true; }
  });
  return (second && !first) ? 'mdy' : 'dmy';
}

// ===================== CLASIFICACI\u00d3N =====================
const stripAccents = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const EQUIPMENT_RULES = [
  ['CALCULADORA','Calculadora'],
  ['NOTEBOOK','Notebook'], ['ELITEBOOK','Notebook'], ['VOSTRO','Notebook'],
  ['CABLE','Cable / cargador'], ['CARGADOR','Cable / cargador'],
  ['MOUSE','Mouse'], ['AUDIFONO','Aud\u00edfono'], ['TECLADO','Teclado'],
  ['GLOBO','Globo terr\u00e1queo'], ['CUADRICULA','Cuadr\u00edcula para corte'],
  ['METAQUEST','Lentes de realidad virtual'], ['EKRON','Tablet'], ['TABLET','Tablet']
];
function detectMaterialType(callNumber, title){
  const cn = stripAccents(callNumber).trim();
  const ti = stripAccents(title).trim();
  if(!cn && !ti) return 'Sin identificar';
  for(const [kw,label] of EQUIPMENT_RULES){ if(cn.includes(kw) || ti.includes(kw)) return label; }
  if(!ti) return 'Otro equipo';
  return BIBLIO;
}
function monthsBefore(date, n){ const d = new Date(date); d.setMonth(d.getMonth() - n); return d; }
function bucketize(due, cutoff){
  if(due >= cutoff) return null;
  if(due >= monthsBefore(cutoff,3)) return 0;
  if(due >= monthsBefore(cutoff,6)) return 1;
  if(due >= monthsBefore(cutoff,12)) return 2;
  if(due >= monthsBefore(cutoff,60)) return 3;
  return 4;
}

// ===================== PROCESAMIENTO =====================
function recompute(){
  const cutoff = DATA.cutoff;
  const items = []; let skipped = 0;
  rawRows.forEach(row => {
    const due = parseDate(row.dateDue);
    if(!due){ skipped++; return; }
    const b = bucketize(due, cutoff);
    if(b === null) return;
    items.push({
      sede: row.libraryDescription || 'Sin sede',
      callNumber: row.callNumber || '',
      title: row.title2 || '',
      material: detectMaterialType(row.callNumber, row.title2),
      estado: row.location || 'Sin dato',
      charged: parseDate(row.dateCharged),
      due: due,
      bucket: b,
      dias: Math.round((cutoff - due) / 864e5)
    });
  });
  DATA.items = items;
  DATA.skipped = skipped;
  DATA.sedes = [...new Set(items.map(i => i.sede))].sort((a,b) => a.localeCompare(b,'es'));
  DATA.materials = [...new Set(items.map(i => i.material))].sort((a,b) => a.localeCompare(b,'es'));
  DATA.estados = [...new Set(items.map(i => i.estado))].sort((a,b) => a.localeCompare(b,'es'));
}
function passBase(it){
  if(state.material !== 'ALL' && it.material !== state.material) return false;
  if(state.estado !== 'ALL' && it.estado !== state.estado) return false;
  if(state.minSev !== 0 && it.bucket < state.minSev) return false;
  return true;
}
const getFull = () => DATA.items.filter(passBase);
const getSel = full => state.sede === 'ALL' ? full : full.filter(i => i.sede === state.sede);

function groupItems(items, keyFn){
  const m = new Map();
  items.forEach(it => {
    const k = keyFn(it);
    let g = m.get(k);
    if(!g){ g = {key:k,total:0,b0:0,b1:0,b2:0,b3:0,b4:0,ge1:0}; m.set(k,g); }
    g.total++; g['b'+it.bucket]++;
    if(it.bucket >= 3) g.ge1++;
  });
  return [...m.values()];
}
function sortRows(id, rows){
  const s = state.sort[id] || {key:'total', dir:'desc'};
  const d = s.dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a,b) => typeof a[s.key] === 'string' ? d * a[s.key].localeCompare(b[s.key],'es') : d * (a[s.key] - b[s.key]));
}

const notice = (html, err) => '<div class="notice' + (err ? ' err' : '') + '">' + html + '</div>';

function groupTable(id, rows, firstLabel, kind, selectedKey){
  const sorted = sortRows(id, rows);
  const max = Math.max(1, ...sorted.map(r => r.total));
  const cur = state.sort[id] || {key:'total', dir:'desc'};
  const cols = [['key',firstLabel,false],['total','Total pendientes',true],['b0','<3 m',true],['b1','3-6 m',true],['b2','6 m-1 a',true],['b3','1-5 a',true],['b4','+5 a',true]];
  let h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + cols.map(([k,t,n]) =>
    '<th class="sortable' + (n ? ' num' : '') + (cur.key === k ? ' sorted' : '') + '" data-sort="' + k + '" data-tid="' + id + '" tabindex="0" scope="col">' + t + (cur.key === k ? (cur.dir === 'asc' ? ' \u25b2' : ' \u25bc') : '') + '</th>'
  ).join('') + '<th scope="col">Distribuci\u00f3n (negro: menos de 1 a\u00f1o \u00b7 amarillo: 1 a\u00f1o o m\u00e1s)</th></tr></thead><tbody>';
  const tot = {total:0,b0:0,b1:0,b2:0,b3:0,b4:0,ge1:0};
  const xrows = [[firstLabel,'Total pendientes','Menos de 3 meses','3 a 6 meses','6 meses a 1 a\u00f1o','1 a 5 a\u00f1os','M\u00e1s de 5 a\u00f1os','1 a\u00f1o o m\u00e1s']];
  sorted.forEach(r => {
    Object.keys(tot).forEach(k => { tot[k] += r[k]; });
    const isSel = selectedKey !== 'ALL' && r.key === selectedKey;
    const cell = v => v ? fmtN(v) : '<span class="zero">\u2013</span>';
    h += '<tr class="clickable' + (isSel ? ' sel' : '') + '" data-rowkind="' + kind + '" data-key="' + encodeURIComponent(r.key) + '" tabindex="0">' +
      '<td>' + esc(r.key) + '</td><td class="num"><b>' + fmtN(r.total) + '</b></td>' +
      [0,1,2,3,4].map(i => '<td class="num">' + cell(r['b'+i]) + '</td>').join('') +
      '<td><div class="mini"><span class="k" style="width:' + ((r.total - r.ge1) / max * 100) + '%"></span><span class="y" style="width:' + (r.ge1 / max * 100) + '%"></span></div></td></tr>';
    xrows.push([r.key, r.total, r.b0, r.b1, r.b2, r.b3, r.b4, r.ge1]);
  });
  h += '<tr class="total"><td>Total</td><td class="num">' + fmtN(tot.total) + '</td>' + [0,1,2,3,4].map(i => '<td class="num">' + fmtN(tot['b'+i]) + '</td>').join('') + '<td></td></tr>';
  h += '</tbody></table></div>';
  xrows.push(['Total', tot.total, tot.b0, tot.b1, tot.b2, tot.b3, tot.b4, tot.ge1]);
  return {html:h, rows:xrows};
}

function baseScales(stacked){

    ? 'Se muestran los ' + fmtN(LIMIT) + ' m\u00e1s antiguos de ' + fmtN(sorted.length) + '. El Excel incluye todos los registros filtrados.'
    : 'Ordenados del m\u00e1s antiguo al m\u00e1s reciente.';
  h += '<div class="grid2">' + panel('detalle','Pr\u00e9stamos pendientes', note, th, xrows, 'full') + '</div>';
  return h;
}
const TAB_RENDER = {resumen:tabResumen, sede:tabSede, material:tabMaterial, estado:tabEstado, detalle:tabDetalle};

// ===================== RENDER =====================
function render(){
  destroyCharts(); post = []; PANELS = {};
  const full = getFull(), sel = getSel(full);
  const view = document.getElementById('view');
  let pre = '';
  if(DATA.skipped > 0) pre += notice('Se omitieron <b>' + fmtN(DATA.skipped) + '</b> filas sin fecha de vencimiento v\u00e1lida.');
  if(!DATA.hasReportDate) pre += notice('La fuente de datos no trae la columna <b>dateCreated</b>: se us\u00f3 la fecha de hoy como fecha de corte.');
  if(typeof Chart === 'undefined') pre += notice('No se pudo cargar la librer\u00eda de gr\u00e1ficos (Chart.js). Revisa tu conexi\u00f3n a internet; las tablas siguen disponibles.', true);
  if(sel.length === 0){
    view.innerHTML = pre + notice('No hay pr\u00e9stamos pendientes que cumplan con los filtros seleccionados.');
  } else {
    view.innerHTML = pre + TAB_RENDER[state.tab](full, sel);
    post.forEach(f => f());
  }
  updateHint(sel.length);
  updateTabs();
  const dateChanged = DATA.reportDate && isoLocal(DATA.reportDate) !== document.getElementById('cutoffInput').value;
  document.getElementById('reportDateBtn').hidden = !dateChanged;
}
function updateHint(n){
  const parts = [];
  if(state.sede !== 'ALL') parts.push(state.sede);
  if(state.material !== 'ALL') parts.push(state.material);
  if(state.estado !== 'ALL') parts.push(state.estado);
  if(state.minSev !== 0) parts.push(MIN_SEV_OPTIONS.find(o => o[0] === state.minSev)[1]);
  document.getElementById('hint').textContent = (parts.length ? 'Filtrando por: ' + parts.join(' \u00b7 ') : 'Sin filtros aplicados') + ' \u2014 ' + fmtN(n) + ' pr\u00e9stamos';
}
function buildTabs(){
  const tl = document.getElementById('tablist');
  tl.innerHTML = TABS.map(t => '<button class="tab" role="tab" type="button" id="tab-' + t.id + '" data-tab="' + t.id + '" aria-selected="false" tabindex="-1">' + t.label + '</button>').join('');
}
function updateTabs(){
  TABS.forEach(t => {
    const b = document.getElementById('tab-' + t.id);
    const on = t.id === state.tab;
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.tabIndex = on ? 0 : -1;
  });
}
function fillSelect(id, options, value){
  const s = document.getElementById(id);
  s.innerHTML = options.map(o => '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>').join('');
  s.value = String(value);
  if(s.value !== String(value)) s.value = options[0][0];
}
function buildControls(){
  if(state.sede !== 'ALL' && !DATA.sedes.includes(state.sede)) state.sede = 'ALL';
  if(state.material !== 'ALL' && !DATA.materials.includes(state.material)) state.material = 'ALL';
  if(state.estado !== 'ALL' && !DATA.estados.includes(state.estado)) state.estado = 'ALL';
  fillSelect('sedeSel', [['ALL','Toda la red']].concat(DATA.sedes.map(s => [s,s])), state.sede);
  fillSelect('materialSel', [['ALL','Todos los tipos de material']].concat(DATA.materials.map(s => [s,s])), state.material);
  fillSelect('sevSel', MIN_SEV_OPTIONS.map(o => [String(o[0]), o[1]]), state.minSev);
  fillSelect('estadoSel', [['ALL','Todos los estados']].concat(DATA.estados.map(s => [s,s])), state.estado);
  document.getElementById('estadoSel').disabled = !DATA.hasEstado;
}
function syncControls(){
  document.getElementById('sedeSel').value = state.sede;
  document.getElementById('materialSel').value = state.material;
  document.getElementById('estadoSel').value = state.estado;
  document.getElementById('sevSel').value = String(state.minSev);
}

// ===================== EVENTOS =====================
document.getElementById('sedeSel').addEventListener('change', e => { state.sede = e.target.value; render(); });
document.getElementById('materialSel').addEventListener('change', e => { state.material = e.target.value; render(); });
document.getElementById('estadoSel').addEventListener('change', e => { state.estado = e.target.value; render(); });
document.getElementById('sevSel').addEventListener('change', e => { state.minSev = parseInt(e.target.value, 10); render(); });
document.getElementById('clearBtn').addEventListener('click', () => {
  state.sede = 'ALL'; state.material = 'ALL'; state.estado = 'ALL'; state.minSev = 0; syncControls(); render();
});
document.getElementById('cutoffInput').addEventListener('change', e => {
  if(!e.target.value) return;
  DATA.cutoff = new Date(e.target.value + 'T23:59:59');
  recompute(); buildControls(); render();
});
document.getElementById('reportDateBtn').addEventListener('click', () => {
  if(!DATA.reportDate) return;
  document.getElementById('cutoffInput').value = isoLocal(DATA.reportDate);
  DATA.cutoff = new Date(isoLocal(DATA.reportDate) + 'T23:59:59');
  recompute(); buildControls(); render();
});
document.getElementById('tablist').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if(!b) return;
  state.tab = b.dataset.tab; render();
});
document.getElementById('tablist').addEventListener('keydown', e => {
  if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = TABS.findIndex(t => t.id === state.tab);
  const n = (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length;
  state.tab = TABS[n].id; render(); document.getElementById('tab-' + state.tab).focus();
});
document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if(act){ handleAct(act); return; }
  const th = e.target.closest('th[data-sort]');
  if(th){
    const id = th.dataset.tid, k = th.dataset.sort, cur = state.sort[id] || {key:'total', dir:'desc'};
    state.sort[id] = {key:k, dir: cur.key === k && cur.dir === 'desc' ? 'asc' : 'desc'};
    render(); return;
  }
  const tr = e.target.closest('tr[data-rowkind]');
  if(tr){
    const key = decodeURIComponent(tr.dataset.key), kind = tr.dataset.rowkind;
    if(kind === 'sede') state.sede = state.sede === key ? 'ALL' : key;
    if(kind === 'material') state.material = state.material === key ? 'ALL' : key;
    if(kind === 'estado') state.estado = state.estado === key ? 'ALL' : key;
    syncControls(); render();
  }
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest && e.target.closest('th[data-sort],tr[data-rowkind]');
  if(el){ e.preventDefault(); el.click(); }
});

// ===================== EXPORTAR =====================
const LIBS = {
  xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  html2canvas:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
};
const libPromises = {};
function loadLib(k){
  const present = k === 'xlsx' ? window.XLSX : k === 'html2canvas' ? window.html2canvas : window.jspdf;
  if(present) return Promise.resolve();
  if(!libPromises[k]) libPromises[k] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = LIBS[k]; s.onload = res;
    s.onerror = () => { delete libPromises[k]; rej(new Error('No se pudo cargar la librer\u00eda de exportaci\u00f3n. Revisa tu conexi\u00f3n a internet.')); };
    document.head.appendChild(s);
  });
  return libPromises[k];
}
const loadLibs = ks => Promise.all(ks.map(loadLib));

function filterContext(){
  const sev = MIN_SEV_OPTIONS.find(o => o[0] === state.minSev)[1];
  return [
    ['Biblioteca', sedeLabel()],
    ['Tipo de material', state.material === 'ALL' ? 'Todos' : state.material],
    ['Estado', state.estado === 'ALL' ? 'Todos' : state.estado],
    ['Antig\u00fcedad del atraso', sev]
  ];
}
function fileBase(label){
  let n = 'Morosos_' + slug(label) + '_' + slug(sedeLabel());
  if(state.material !== 'ALL') n += '_' + slug(state.material);
  if(state.estado !== 'ALL') n += '_' + slug(state.estado);
  if(state.minSev !== 0) n += '_min' + state.minSev;
  return n + '_corte_' + isoLocal(DATA.cutoff);
}
function sheetName(title, used){
  let n = title.replace(/[\\\/?*\[\]:]/g,' ').trim().slice(0,31) || 'Hoja';
  let k = n, i = 2;
  while(used.has(k.toLowerCase())){ k = n.slice(0, 28) + ' ' + i++; }
  used.add(k.toLowerCase());
  return k;
}
async function exportExcel(ids, label){
  await loadLibs(['xlsx']);
  const wb = XLSX.utils.book_new();
  const ctx = [['Panel de gesti\u00f3n de morosos - Bibliotecas Duoc UC'], ['Fecha de corte', fmtDate(DATA.cutoff)]].concat(filterContext()).concat([['Generado', new Date().toLocaleString('es-CL')]]);
  const used = new Set(['filtros']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ctx), 'Filtros');
  ids.forEach(id => {
    const p = PANELS[id]; if(!p) return;
    const ws = XLSX.utils.aoa_to_sheet(p.rows);
    ws['!cols'] = p.rows[0].map((_,c) => ({wch: Math.min(50, Math.max(10, ...p.rows.slice(0,200).map(r => String(r[c] == null ? '' : r[c]).length)))}));
    XLSX.utils.book_append_sheet(wb, ws, sheetName(p.title, used));
  });
  XLSX.writeFile(wb, fileBase(label) + '.xlsx');
}
async function exportPDF(el, label){
  await loadLibs(['html2canvas','jspdf']);
  document.body.classList.add('exporting');
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 80)));
  let canvas;
  try{ canvas = await html2canvas(el, {scale:2, backgroundColor:'#EEEEEE', useCORS:true}); }
  finally{ document.body.classList.remove('exporting'); }
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF('l','mm','a4');
  const pw = 297, ph = 210, m = 10, hdrH = 16;
  const usableW = pw - 2*m, availH = ph - m - hdrH - m;
  const mmPerPx = usableW / canvas.width;
  const slicePx = Math.floor(availH / mmPerPx);
  const pages = Math.max(1, Math.ceil(canvas.height / slicePx));
  const ctxLine = 'Corte: ' + fmtDate(DATA.cutoff) + '  |  ' + filterContext().map(r => r[0] + ': ' + r[1]).join('  |  ');
  for(let p = 0; p < pages; p++){
    if(p > 0) pdf.addPage();
    const sy = p * slicePx, sh = Math.min(slicePx, canvas.height - sy);
    const part = document.createElement('canvas');
    part.width = canvas.width; part.height = sh;
    part.getContext('2d').drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(12);
    pdf.text('Panel de gesti\u00f3n de morosos - Bibliotecas Duoc UC: ' + label, m, m + 4);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(102);
    pdf.text(pdf.splitTextToSize(ctxLine, usableW)[0], m, m + 9);
    pdf.setTextColor(0);
    pdf.addImage(part.toDataURL('image/png'), 'PNG', m, m + hdrH, usableW, sh * mmPerPx);
    pdf.setFontSize(8); pdf.setTextColor(102);
    pdf.text('P\u00e1gina ' + (p+1) + ' de ' + pages, pw - m, ph - 5, {align:'right'});
    pdf.setTextColor(0);
  }
  pdf.save(fileBase(label) + '.pdf');
}
async function handleAct(btn){
  const act = btn.dataset.act;
  const tabLabel = TABS.find(t => t.id === state.tab).label;
  const prev = btn.textContent;
  btn.disabled = true; btn.textContent = '\u2026';
  try{
    if(act === 'xlsx'){ const p = btn.dataset.p; await exportExcel([p], PANELS[p].title); }
    else if(act === 'pdf'){ const p = btn.dataset.p; await exportPDF(document.getElementById('p-' + p), PANELS[p].title); }
    else if(act === 'sec-xlsx'){ await exportExcel(btn.dataset.ids.split(','), tabLabel); }
    else if(act === 'sec-pdf'){ await exportPDF(document.getElementById('view'), tabLabel); }
  }catch(err){
    console.error(err);
    showToast(err.message || 'No se pudo generar el archivo. Intenta nuevamente.');
  }finally{
    btn.disabled = false; btn.textContent = prev;
  }
}

// ===================== CARGA INICIAL =====================
function setStatus(kind, main, detail){
  const el = document.getElementById('status');
  el.className = 'status' + (kind === 'ok' ? ' ok' : kind === 'warn' ? ' warn' : '');
  el.innerHTML = (kind === 'loading' ? '<span class="spinner" aria-hidden="true"></span>' : '') +
    '<span class="status-main">' + esc(main) + '</span>' + (detail ? '<span class="status-detail">' + esc(detail) + '</span>' : '');
}
function startDashboard(){
  let rd = null;
  rawRows.forEach(r => { const d = parseDate(r.dateCreated); if(d && (!rd || d > rd)) rd = d; });
  DATA.hasReportDate = !!rd;
  DATA.reportDate = rd;
  DATA.hasEstado = rawRows.some(r => r.location);
  const base = rd || new Date();
  document.getElementById('cutoffInput').value = isoLocal(base);
  DATA.cutoff = new Date(isoLocal(base) + 'T23:59:59');
  recompute(); buildControls(); render();
}
async function initData(){
  buildTabs();
  setStatus('loading', 'Cargando los datos, espera un momento\u2026');
  let msg = null, okDetail = '';
  if(!SHEET_CSV_URL){
    rawRows = snapshotRows(); dateOrder = 'dmy';
    msg = 'La planilla en l\u00ednea a\u00fan no est\u00e1 configurada: se muestran los datos del informe al ' + SNAPSHOT_LABEL + '.';
  } else {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
    try{
      const resp = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), {signal:ctrl.signal, cache:'no-store'});
      if(!resp.ok) throw new Error('HTTP ' + resp.status);
      const rows = rowsFromCSV(await resp.text());
      dateOrder = detectDateOrder(rows.slice(0,2000).map(r => r.dateDue).filter(Boolean));
      rawRows = rows;
      okDetail = 'Planilla en l\u00ednea \u00b7 consultada ' + new Date().toLocaleString('es-CL') + ' \u00b7 ' + fmtN(rows.length) + ' registros';
    }catch(err){
      console.error(err);
      rawRows = snapshotRows(); dateOrder = 'dmy';
      const reason = err.name === 'AbortError' ? 'tiempo de espera agotado' : err.message;
      msg = 'No se pudo leer la planilla (' + reason + '): se muestran los datos de respaldo del informe al ' + SNAPSHOT_LABEL + '.';
    }finally{ clearTimeout(timer); }
  }
  if(typeof Chart !== 'undefined' && typeof ChartDataLabels !== 'undefined'){
    Chart.register(ChartDataLabels);
    Chart.defaults.font.family = "'Lato', Arial, sans-serif";
    Chart.defaults.color = C.gris;
  }
  startDashboard();
  if(msg) setStatus('warn', '\u26a0 ' + msg);
  else setStatus('ok', '\u2713 Datos cargados correctamente.', okDetail + (DATA.reportDate ? ' \u00b7 Informe al ' + fmtDate(DATA.reportDate) : ''));
}
initData();
